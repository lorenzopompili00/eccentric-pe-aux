# SXS catalog ID for the NR waveform
SXS_ID: "SXS:BBH:3617"

# Time in M units at which the tapering will end
t_taper: 500 

# Injection parameters
injection_dict:
  total_mass: 60.0
  luminosity_distance: 400.0
  dec: -0.44
  ra: 0.05
  iota: 0.66
  psi: 3.0
  phase: 4.3
  geocent_time: 1126259462.391

# Output settings
channel_suffix: "INJECTED"
debug: false

# Waveform parameters
sampling_rate: 2048.0
post_trigger_duration: 4.0
duration: 16.0

# Detector network
detectors:
  - H1
  - L1

# Noise settings
# "zero" (default), "gaussian" (Gaussian noise from a PSD), or "real" (fetched detector data).
noise_type: "zero"

# --- Gaussian noise ---
# generation_seed: 1234
# psd_dict:
#   H1: /path/to/H1_psd.txt
#   L1: /path/to/L1_psd.txt

# --- Real noise ---
# channel_dict:
#   H1: GWOSC
#   L1: GWOSC
# Local frame files (optional)
# data_dict:
#   H1: /path/to/H1.gwf
#   L1: /path/to/L1.gwf
