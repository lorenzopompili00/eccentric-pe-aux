# NR waveform format: "sxs" or "canuda"
nr_format: "sxs"

# SXS catalog ID for the NR waveform (nr_format: "sxs")
SXS_ID: "SXS:BBH:3617"

# Local waveform file (SXS-format file for "sxs", HDF5 file for "canuda")
# sim_file: /path/to/q2_mu04_strain.h5
# Label used in output files and plot titles (default: SXS_ID or the sim_file basename)
# label: q2_mu04

# Duration in M of the start taper. For "sxs" it starts at the SXS reference
# time; for "canuda" at t_start (default 100 M, after the junk radiation).
# Canuda waveforms are shorter (~1000 M), so use a taper below 500 M there.
t_taper: 500
# t_start: 100

# Injection parameters
injection_dict:
  total_mass: 60.0
  luminosity_distance: 400.0
  dec: -0.44
  ra: 0.05
  iota: 0.66
  psi: 3.0
  phase: 4.3
  geocent_time: 1126259462.391

# Output settings
channel_suffix: "INJECTED"
debug: false

# Waveform parameters
sampling_rate: 2048.0
post_trigger_duration: 4.0
duration: 16.0

# Detector network
detectors:
  - H1
  - L1

# Noise settings
# "zero" (default), "gaussian" (Gaussian noise from a PSD), or "real" (fetched detector data).
noise_type: "zero"

# --- Gaussian noise ---
# generation_seed: 1234
# psd_dict:
#   H1: /path/to/H1_psd.txt
#   L1: /path/to/L1_psd.txt

# --- Real noise ---
# channel_dict:
#   H1: GWOSC
#   L1: GWOSC
# Local frame files (optional)
# data_dict:
#   H1: /path/to/H1.gwf
#   L1: /path/to/L1.gwf
